<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>インターバルタイマー</title>
<style>
  :root {
    --bg: #f4f2ee; --fg: #1d1d1b; --sub: #6b6862; --line: #d8d4cc; --panel: #fffefb;
    --prep: #8a6d00; --work: #b3261e; --rest: #1f5f8b; --done: #2e6b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161614; --fg:#f0eee8; --sub:#9c988f; --line:#333029; --panel:#1e1d1a;
      --prep:#e0b93a; --work:#ef6b62; --rest:#6db2e6; --done:#6fc283; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif; min-height:100vh; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:16px; font-weight:600; margin:8px 0 16px; color:var(--sub); letter-spacing:.05em; }

  .display { background:var(--panel); border:1px solid var(--line); padding:24px 16px; text-align:center; }
  .phase { font-size:20px; font-weight:700; letter-spacing:.1em; }
  .time { font-size:clamp(88px,28vw,148px); font-weight:700; line-height:1.05;
    font-variant-numeric:tabular-nums; margin:8px 0; }
  .info { color:var(--sub); font-size:15px; }
  .bar { height:6px; background:var(--line); margin-top:16px; }
  .bar > i { display:block; height:100%; width:0; background:currentColor; }
  .display[data-phase="prep"] { color:var(--prep); }
  .display[data-phase="work"] { color:var(--work); }
  .display[data-phase="rest"] { color:var(--rest); }
  .display[data-phase="done"] { color:var(--done); }
  .display[data-phase="idle"] { color:var(--fg); }
  .display .info { color:var(--sub); }

  .controls { display:flex; gap:8px; margin:12px 0; }
  button { font:inherit; font-size:18px; padding:14px; border:1px solid var(--fg); background:var(--fg);
    color:var(--bg); cursor:pointer; flex:1; }
  button.sec { background:transparent; color:var(--fg); border-color:var(--line); }
  button:disabled { opacity:.35; cursor:default; }

  .settings { background:var(--panel); border:1px solid var(--line); padding:8px 16px 16px; }
  .settings h2 { font-size:14px; color:var(--sub); font-weight:600; margin:12px 0 4px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-of-type { border-bottom:0; }
  .row label { font-size:16px; }
  .field { display:flex; align-items:center; gap:6px; }
  .field input[type=number] { width:64px; font:inherit; font-size:18px; padding:8px 4px; text-align:center;
    background:var(--bg); color:var(--fg); border:1px solid var(--line); }
  .field span { color:var(--sub); font-size:14px; width:2em; }
  .step { width:36px; height:36px; padding:0; flex:none; font-size:20px; }
  .total { color:var(--sub); font-size:14px; margin-top:8px; }
  .check { display:flex; align-items:center; gap:8px; padding:10px 0; font-size:15px; }
  .check input { width:20px; height:20px; }
  select { font:inherit; font-size:16px; padding:8px; background:var(--bg); color:var(--fg); border:1px solid var(--line); }
  input[type=range] { width:140px; }
  .tests { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0; }
  .tests button { font-size:15px; padding:10px; }
  .legend { color:var(--sub); font-size:13px; line-height:1.7; margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>インターバルタイマー</h1>

  <section class="display" id="display" data-phase="idle">
    <div class="phase" id="phase">準備完了</div>
    <div class="time" id="time">0:00</div>
    <div class="info" id="info">下の設定で開始を押す</div>
    <div class="bar"><i id="bar"></i></div>
  </section>

  <div class="controls">
    <button id="startBtn">開始</button>
    <button id="skipBtn" class="sec" disabled>スキップ</button>
    <button id="resetBtn" class="sec">リセット</button>
  </div>

  <section class="settings" id="settings">
    <h2>時間</h2>
    <div class="row"><label for="prep">準備</label>
      <div class="field"><button class="step sec" data-d="-5" data-t="prep">−</button>
      <input type="number" id="prep" min="0" max="3599"><button class="step sec" data-d="5" data-t="prep">+</button><span>秒</span></div></div>
    <div class="row"><label for="work">ワークアウト</label>
      <div class="field"><button class="step sec" data-d="-5" data-t="work">−</button>
      <input type="number" id="work" min="1" max="3599"><button class="step sec" data-d="5" data-t="work">+</button><span>秒</span></div></div>
    <div class="row"><label for="rest">休憩</label>
      <div class="field"><button class="step sec" data-d="-5" data-t="rest">−</button>
      <input type="number" id="rest" min="0" max="3599"><button class="step sec" data-d="5" data-t="rest">+</button><span>秒</span></div></div>
    <h2>セット数</h2>
    <div class="row"><label for="rounds">ラウンド（ワークアウト＋休憩）</label>
      <div class="field"><button class="step sec" data-d="-1" data-t="rounds">−</button>
      <input type="number" id="rounds" min="1" max="99"><button class="step sec" data-d="1" data-t="rounds">+</button><span>回</span></div></div>
    <label class="check"><input type="checkbox" id="skipLastRest"> 最後のラウンドの休憩を省く</label>
    <h2>音</h2>
    <div class="row"><label for="soundSet">音の種類</label>
      <select id="soundSet" class="live"></select></div>
    <div class="row"><label for="volume">音量</label>
      <div class="field"><input type="range" id="volume" class="live" min="0" max="100" step="5"><span id="volLabel" style="width:3em"></span></div></div>
    <div class="tests">
      <button class="sec live" data-ev="count">残り3秒</button>
      <button class="sec live" data-ev="work">ワークアウト開始</button>
      <button class="sec live" data-ev="rest">休憩開始</button>
      <button class="sec live" data-ev="done">全終了</button>
    </div>
    <label class="check"><input type="checkbox" id="mute" class="live"> 音を消す</label>
    <div class="total" id="total"></div>
    <div class="legend">
      どの種類も1回だけ鳴ります。残り3・2・1秒は短い音、ワークアウト開始は高い音、休憩開始は低い音、全終了は一番長い音です。
      上のボタンで試し聞きできます。声が大きい場所では、音量を最大にして端末側の音量も上げてください。
    </div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'interval-timer-settings-v1';
  const DEFAULTS = { prep: 10, work: 30, rest: 10, rounds: 8, skipLastRest: true, mute: false, soundSet: 'horn', volume: 100 };
  const inputs = ['prep', 'work', 'rest', 'rounds'];

  // ---------- 設定 ----------
  let settings = { ...DEFAULTS };
  try { Object.assign(settings, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}

  function clamp(v, min, max) { v = Math.floor(Number(v)); if (isNaN(v)) v = min; return Math.min(max, Math.max(min, v)); }
  function readSettings() {
    settings.prep = clamp($('prep').value, 0, 3599);
    settings.work = clamp($('work').value, 1, 3599);
    settings.rest = clamp($('rest').value, 0, 3599);
    settings.rounds = clamp($('rounds').value, 1, 99);
    settings.skipLastRest = $('skipLastRest').checked;
    settings.mute = $('mute').checked;
    settings.soundSet = SETS[$('soundSet').value] ? $('soundSet').value : 'horn';
    settings.volume = clamp($('volume').value, 0, 100);
    if (master) master.gain.value = settings.volume / 100 * 1.5;
    $('volLabel').textContent = settings.volume + '%';
    try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch (e) {}
  }
  function writeSettings() {
    inputs.forEach(k => $(k).value = settings[k]);
    $('skipLastRest').checked = settings.skipLastRest;
    $('mute').checked = settings.mute;
    $('soundSet').value = settings.soundSet;
    $('volume').value = settings.volume;
  }
  const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

  function buildSegments() {
    const seg = [];
    if (settings.prep > 0) seg.push({ type: 'prep', dur: settings.prep, round: 0 });
    for (let r = 1; r <= settings.rounds; r++) {
      seg.push({ type: 'work', dur: settings.work, round: r });
      const last = r === settings.rounds;
      if (settings.rest > 0 && !(last && settings.skipLastRest)) seg.push({ type: 'rest', dur: settings.rest, round: r });
    }
    return seg;
  }
  function updateTotal() {
    const t = buildSegments().reduce((a, s) => a + s.dur, 0);
    $('total').textContent = '合計時間: ' + fmt(t) + '（' + settings.rounds + 'ラウンド）';
  }

  // ---------- 音 ----------
  // 声（300〜3000Hz）に埋もれないよう、倍音の多い波形(のこぎり波・矩形波)と
  // 声より高い2〜3kHz帯を使い、コンプレッサーで音量を詰めて最大限大きくしている。
  let ctx = null, master = null;
  function ensureAudio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -10; comp.knee.value = 0; comp.ratio.value = 20;
        comp.attack.value = 0.002; comp.release.value = 0.08;
        master = ctx.createGain();
        master.gain.value = settings.volume / 100 * 1.5;
        master.connect(comp); comp.connect(ctx.destination);
      }
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }
  function tone(freq, start, dur, vol = 0.8, type = 'square', o = {}) {
    if (!ctx || settings.mute) return;
    const t0 = ctx.currentTime + start;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t0);
    if (o.to) osc.frequency.linearRampToValueAtTime(o.to, t0 + dur);
    if (o.vib) {
      const l = ctx.createOscillator(), lg = ctx.createGain();
      l.frequency.value = o.vib; lg.gain.value = o.depth || 100;
      l.connect(lg).connect(osc.frequency); l.start(t0); l.stop(t0 + dur + 0.05);
    }
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.005);
    if (o.decay) g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    else { g.gain.setValueAtTime(vol, t0 + Math.max(0.006, dur - 0.03)); g.gain.linearRampToValueAtTime(0.0001, t0 + dur); }
    osc.connect(g).connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function bell(base, start, dur, vol) {
    [1, 2.76, 5.4, 8.93].forEach((r, i) => tone(base * r, start, dur / (1 + i * 0.5), vol / (1 + i * 0.5), 'sine', { decay: true }));
  }
  function pulses(freqs, start, len, gap, vol) {
    freqs.forEach((f, i) => tone(f, start + i * (len + gap), len, vol, 'square'));
  }
  const SETS = {
    horn: { label: 'ブザー（体育館のホーン風・太く大きい）',
      count: () => tone(1000, 0, 0.18, 0.85, 'sawtooth'),
      work:  () => { tone(1100, 0, 0.7, 0.85, 'sawtooth'); tone(1108, 0, 0.7, 0.85, 'sawtooth'); },
      rest:  () => { tone(440, 0, 0.7, 0.9, 'sawtooth'); tone(446, 0, 0.7, 0.9, 'sawtooth'); },
      done:  () => { tone(1400, 0, 1.8, 0.9, 'sawtooth'); tone(1410, 0, 1.8, 0.9, 'sawtooth'); } },
    whistle: { label: 'ホイッスル（高くて鋭い・声を突き抜ける）',
      count: () => tone(2600, 0, 0.14, 0.9, 'triangle'),
      work:  () => tone(3000, 0, 0.7, 0.9, 'triangle', { vib: 28, depth: 120 }),
      rest:  () => tone(1900, 0, 0.7, 0.9, 'triangle', { vib: 22, depth: 80 }),
      done:  () => tone(3400, 0, 1.8, 0.9, 'triangle', { vib: 30, depth: 140 }),
    alarm: { label: '電子アラーム（ピピピ・連続音）',
      count: () => tone(2400, 0, 0.12, 0.8, 'square'),
      work:  () => tone(2600, 0, 0.6, 0.8, 'square'),
      rest:  () => tone(1000, 0, 0.6, 0.85, 'square'),
      done:  () => tone(2000, 0, 1.6, 0.8, 'square'),
    gong: { label: 'ゴング・ベル（金属音・余韻あり）',
      count: () => bell(1500, 0, 0.35, 0.8),
      work:  () => bell(1100, 0, 1.2, 0.9),
      rest:  () => bell(500, 0, 1.8, 1.0),
      done:  () => bell(800, 0, 3.0, 1.0) },
  };
  Object.keys(SETS).forEach(k => { const op = document.createElement('option'); op.value = k; op.textContent = SETS[k].label; $('soundSet').appendChild(op); });
  const sounds = {
    count: () => SETS[settings.soundSet].count(),
    work:  () => SETS[settings.soundSet].work(),
    rest:  () => SETS[settings.soundSet].rest(),
    prep:  () => SETS[settings.soundSet].count(),
    done:  () => SETS[settings.soundSet].done(),
  };

  // ---------- タイマー本体 ----------
  const LABEL = { prep: '準備', work: 'ワークアウト', rest: '休憩', done: '終了', idle: '準備完了' };
  let segs = [], idx = 0, remainMs = 0, last = 0, timer = null, running = false, started = false, lastBeep = null;
  let wakeLock = null;

  async function lockScreen() { try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
  function unlockScreen() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && running) lockScreen(); });

  function render() {
    const d = $('display');
    if (!started) {
      d.dataset.phase = 'idle'; $('phase').textContent = LABEL.idle; $('time').textContent = fmt(settings.work);
      $('info').textContent = '下の設定で開始を押す'; $('bar').style.width = '0';
      document.title = 'インターバルタイマー'; return;
    }
    if (idx >= segs.length) {
      d.dataset.phase = 'done'; $('phase').textContent = LABEL.done; $('time').textContent = '0:00';
      $('info').textContent = settings.rounds + 'ラウンド完了'; $('bar').style.width = '100%';
      document.title = '終了'; return;
    }
    const s = segs[idx], sec = Math.ceil(remainMs / 1000);
    d.dataset.phase = s.type; $('phase').textContent = LABEL[s.type]; $('time').textContent = fmt(sec);
    $('info').textContent = s.type === 'prep' ? 'まもなく開始' : 'ラウンド ' + s.round + ' / ' + settings.rounds;
    $('bar').style.width = (100 * (1 - remainMs / (s.dur * 1000))) + '%';
    document.title = fmt(sec) + ' ' + LABEL[s.type];
  }

  function enterSegment(i, playStart = true) {
    idx = i; lastBeep = null;
    if (idx >= segs.length) { finish(); return; }
    remainMs = segs[idx].dur * 1000;
    if (playStart) sounds[segs[idx].type]();
    render();
  }
  function finish() {
    running = false; clearInterval(timer); timer = null; unlockScreen();
    sounds.done(); render(); setUi();
  }
  function tick() {
    const now = Date.now(); remainMs -= now - last; last = now;
    while (remainMs <= 0 && running) {
      const over = -remainMs;
      enterSegment(idx + 1);
      if (idx >= segs.length) return;
      remainMs -= over;
    }
    const sec = Math.ceil(remainMs / 1000);
    if (sec <= 3 && sec >= 1 && sec !== lastBeep && sec * 1000 !== segs[idx].dur * 1000) {
      lastBeep = sec; sounds.count();
    }
    render();
  }

  function setUi() {
    $('startBtn').textContent = running ? '一時停止' : (started && idx < segs.length ? '再開' : '開始');
    $('skipBtn').disabled = !(started && idx < segs.length);
    document.querySelectorAll('#settings input:not(.live), #settings .step').forEach(e => e.disabled = started && idx < segs.length);
  }

  function start() {
    ensureAudio();
    if (!started || idx >= segs.length) {
      readSettings(); segs = buildSegments(); started = true; enterSegment(0);
    }
    running = true; last = Date.now(); lockScreen();
    timer = setInterval(tick, 100); setUi();
  }
  function pause() { running = false; clearInterval(timer); timer = null; unlockScreen(); setUi(); }
  function reset() {
    pause(); started = false; idx = 0; setUi(); updateTotal(); render();
  }

  $('startBtn').onclick = () => running ? pause() : start();
  $('skipBtn').onclick = () => { ensureAudio(); enterSegment(idx + 1); if (running) last = Date.now(); setUi(); };
  $('resetBtn').onclick = reset;

  document.querySelectorAll('.step').forEach(b => b.onclick = () => {
    const el = $(b.dataset.t); el.value = Number(el.value) + Number(b.dataset.d); onChange();
  });
  function onChange() { readSettings(); writeSettings(); updateTotal(); if (!started) render(); }
  document.querySelectorAll('#settings input, #settings select').forEach(e => e.addEventListener('change', onChange));
  $('volume').addEventListener('input', onChange);
  document.querySelectorAll('.tests button').forEach(b => b.onclick = () => { ensureAudio(); sounds[b.dataset.ev](); });

  writeSettings(); readSettings(); updateTotal(); render(); setUi();
})();
</script>
</body>
</html>
